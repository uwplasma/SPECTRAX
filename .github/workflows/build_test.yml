# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # cheap hosted check that also runs for fork PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Lint with flake8
      run: |
        python -m pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build:
    # fork PRs run on hosted Ubuntu, never on the self-hosted machines
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && matrix.python-version == '3.12')) && fromJSON('["self-hosted","uwplasma-cpu"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12']
    name: Python ${{ matrix.python-version }} Test
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: false
    - name: Install spectrax
      run: |
        uv venv
        uv pip install . flake8 pytest coverage pytest-cov pytest-xdist
        if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run tests with coverage
      run: |
        uv run pytest -n 3 -m "not gpu" --cov-branch --cov-report=xml --cov=spectrax
    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: uwplasma/SPECTRAX

  gpu:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, uwplasma-gpu]
    timeout-minutes: 5
    name: GPU smoke
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.12'
        enable-cache: false
    - name: Install
      run: |
        uv venv
        uv pip install . pytest 'jax[cuda12]'
        if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi
    - name: Check GPU backend
      run: uv run python -c "import jax; assert jax.default_backend()=='gpu', jax.devices()"
    - name: GPU tests
      timeout-minutes: 1
      run: uv run pytest -m gpu -q -x
