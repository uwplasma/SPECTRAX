# Landau damping of a Langmuir wave: k lambda_De = 0.44 (lambda_De = vth / sqrt(2) = 0.0707 c/omega_pe).
# Run with:  spectrax input_1D_landau_damping.toml
[input_parameters]
Lx = 1.0             # box length in c/omega_pe; the wave is the first Fourier mode
t_max = 50.0         # in 1/omega_pe
nu = 1.0             # high-Hermite sink, closes the Hermite hierarchy
ode_tolerance = 1e-8

[solver_parameters]
Nx = 3               # Fourier modes in x
Nn = 40              # Hermite modes in v_x
timesteps = 501      # saved times

[species.electrons]
charge = -1
mass = 1
vth = 0.1                       # sqrt(2 T / m) / c
perturbation_amplitude = 0.001  # density * (1 + 0.001 cos(2 pi x / Lx))

[species.protons]
charge = 1
mass = 1836
vth = 0.0023
